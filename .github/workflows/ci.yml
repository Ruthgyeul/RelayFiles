name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:emoji
      - run: npm run check:cycles
      - run: npm run check:migrations
      - run: npm run test
      - run: npm run build

  security:
    name: Security (npm audit · secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the commits of the push or pull request.
          fetch-depth: 0
      # Runtime dependencies only: a high or critical advisory in what ships fails the build.
      - run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scripts:
    name: Workflows · shell scripts (actionlint · shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz from the release's checksums.txt.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Syntax, expressions and `needs` of every workflow; the runner's shellcheck also checks
      # the `run:` blocks.
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" actionlint
          ./actionlint -color
      # The deploy scripts run as root on the server; -x follows `source lib.sh` (.shellcheckrc).
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x deploy/scripts/*.sh deploy/scripts/systemd/*.sh deploy/scripts/k3s/*.sh deploy/docker-entrypoint.sh

  e2e:
    name: E2E (360 / 768 / 1280)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: relayfiles
          POSTGRES_USER: relayfiles
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relayfiles" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_HOST: localhost
      REDIS_PASSWORD: ci-redis-password
      # Absolute: the standalone server changes into .next/standalone when it starts.
      STORAGE_ROOT: ${{ github.workspace }}/.data/relayfilesDB
      # Test-only secrets (not used anywhere else).
      TOKEN_ENC_KEY: Y2ktb25seS10b2tlbi1lbmNyeXB0aW9uLWtleS0zMmI=
      TOKEN_HMAC_KEY: ci-only-token-lookup-hmac-key-0123456789
      COOKIE_SECRET: ci-only-cookie-signing-secret-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7 redis-server --requirepass "$REDIS_PASSWORD"
          for _ in $(seq 1 20); do docker exec redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG && break; sleep 1; done
      - run: npx prisma migrate deploy
      - run: npm run volume:init
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  integration:
    name: Integration (PostgreSQL · Redis · migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: relayfiles
          POSTGRES_USER: relayfiles
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relayfiles" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_HOST: localhost
      REDIS_PASSWORD: ci-redis-password
      # Absolute: the standalone server changes into .next/standalone when it starts.
      STORAGE_ROOT: ${{ github.workspace }}/.data/relayfilesDB
      # Test-only secrets (not used anywhere else).
      TOKEN_ENC_KEY: Y2ktb25seS10b2tlbi1lbmNyeXB0aW9uLWtleS0zMmI=
      TOKEN_HMAC_KEY: ci-only-token-lookup-hmac-key-0123456789
      COOKIE_SECRET: ci-only-cookie-signing-secret-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Redis runs with a password like in production (service containers cannot pass server flags).
      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7 redis-server --requirepass "$REDIS_PASSWORD"
          for _ in $(seq 1 20); do docker exec redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG && break; sleep 1; done
      - name: Migrations apply cleanly and match the schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run volume:init
      - name: Install ffmpeg (video thumbnails)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm run test:integration

  docker:
    name: Docker images (app · tools) and compose config
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the app and tools images
        run: |
          docker build --target app -t relayfiles-app:ci .
          docker build --target tools -t relayfiles-tools:ci .
      # .dockerignore is an allowlist: the tools image (COPY . .) holds nothing else, and no
      # host-generated Prisma client or test file slipped in.
      - name: Check the tools image contents
        run: |
          expected="deploy next.config.ts node_modules package-lock.json package.json postcss.config.mjs prisma prisma.config.ts scripts src tsconfig.json"
          actual="$(docker run --rm --entrypoint ls relayfiles-tools:ci -A /app | sort | xargs)"
          [ "$actual" = "$expected" ] || { echo "Unexpected /app contents: $actual" >&2; exit 1; }
          tests="$(docker run --rm --entrypoint find relayfiles-tools:ci /app/src /app/scripts -name "*.test.ts*")"
          [ -z "$tests" ] || { echo "Test files in the tools image: $tests" >&2; exit 1; }
          for dev in vitest eslint jsdom; do
            if docker run --rm --entrypoint test relayfiles-tools:ci -e "/app/node_modules/$dev"; then
              echo "devDependency $dev in the tools image" >&2
              exit 1
            fi
          done
      # Known vulnerabilities in the images (OS packages and npm), failing only on critical ones
      # that already have a fix, so a new base image or package update clears them.
      - name: Scan the app image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: relayfiles-app:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
      - name: Scan the tools image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: relayfiles-tools:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
      - name: Validate the production compose file
        run: |
          cp .env.example .env
          sed -i 's|^STORAGE_ROOT=.*|STORAGE_ROOT=/mnt/relayfilesDB|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-postgres-password|; s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=ci-redis-password|' .env
          docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
          docker compose --env-file .env -f deploy/docker-compose.yml --profile tools --profile tunnel config --quiet
          docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.volumes.example.yml --profile tools config --quiet
