name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:emoji
      - run: npm run test
      - run: npm run build

  e2e:
    name: E2E (360 / 768 / 1280)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"

  integration:
    name: Integration (PostgreSQL · Redis · migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: relayfiles
          POSTGRES_USER: relayfiles
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relayfiles" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_HOST: localhost
      REDIS_PASSWORD: ci-redis-password
      STORAGE_ROOT: ./.data/relayfilesDB
      # Test-only secrets (not used anywhere else).
      TOKEN_ENC_KEY: Y2ktb25seS10b2tlbi1lbmNyeXB0aW9uLWtleS0zMmI=
      TOKEN_HMAC_KEY: ci-only-token-lookup-hmac-key-0123456789
      COOKIE_SECRET: ci-only-cookie-signing-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Redis runs with a password like in production (service containers cannot pass server flags).
      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7 redis-server --requirepass "$REDIS_PASSWORD"
          for i in $(seq 1 20); do docker exec redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG && break; sleep 1; done
      - name: Migrations apply cleanly and match the schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run volume:init
      - run: npm run test:integration
