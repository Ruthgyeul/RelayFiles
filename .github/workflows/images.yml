name: Images

# The Raspberry Pi nodes (Pi 5 / Pi 4) run arm64 and the N95 server amd64. Building under QEMU is
# slow, so pull requests only build arm64 when they change what goes into the images. A push to
# main publishes from its CI run (ci.yml calls this workflow once every check has passed), and a
# version tag (made on a main commit that passed) publishes right away: both architectures go to
# GHCR as one multi-arch image each (docs/deploy-k3s.md): ghcr.io/<owner>/relayfiles-app and
# ghcr.io/<owner>/relayfiles-tools. Called from CI, the run keeps CI's commit (github.sha), so the
# tags, the revision label and the signed provenance all name the commit that was tested.
on:
  workflow_call:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - package.json
      - package-lock.json
      - .github/workflows/images.yml

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} (linux/arm64)
    if: github.event_name == 'pull_request'
    # A newer push to the pull request drops the outdated build. (No workflow-level group: called
    # from CI, it would share CI's.)
    concurrency:
      group: images-pr-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [app, tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        run: |
          docker buildx build --platform linux/arm64 --target "${{ matrix.target }}" \
            --cache-from "type=gha,scope=arm64-${{ matrix.target }}" \
            --cache-to "type=gha,mode=max,scope=arm64-${{ matrix.target }}" \
            --tag "relayfiles-${{ matrix.target }}:arm64-ci" .

  publish:
    name: Publish ${{ matrix.target }} (linux/amd64 + linux/arm64)
    # A version tag, or a push to main whose CI called this workflow after passing.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Signed build provenance (Sigstore, keyless through the workflow's OIDC identity).
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [app, tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A version tag publishes "vX.Y.Z" and "latest": it must name the version the code carries
      # and that version must have its CHANGELOG.md section (docs/runbook.md "릴리스 만들기").
      - name: Check the tag against package.json and CHANGELOG.md
        if: github.ref_type == 'tag'
        run: node scripts/check-changelog.mjs --tag "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # sha-<12 hex> for every push (what deploy/scripts/k3s/deploy.sh pins), plus the version and
      # "latest" for a v* tag ("main" is the next step). GHCR names must be lowercase.
      - name: Build and push
        id: push
        env:
          TARGET: ${{ matrix.target }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/relayfiles-${TARGET}"
          tags=(--tag "${image}:sha-${GITHUB_SHA::12}")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags+=(--tag "${image}:${GITHUB_REF_NAME}" --tag "${image}:latest")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --target "$TARGET" \
            --cache-from "type=gha,scope=arm64-${TARGET}" \
            --cache-from "type=gha,scope=multi-${TARGET}" \
            --cache-to "type=gha,mode=max,scope=multi-${TARGET}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --provenance=mode=max --sbom=true \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            "${tags[@]}" --push .
          # The pushed manifest list's digest: what the attestation signs and deploy.sh pins.
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")"
          [[ "$digest" == sha256:* ]] || { echo "No image digest in the build metadata" >&2; exit 1; }
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${image}@${digest}" >> "$GITHUB_STEP_SUMMARY"
      # Runs of successive main commits can finish in any order: "main" moves only while this
      # commit is still the tip of main, so an older image never replaces a newer one.
      - name: Point "main" at the image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "main has moved on to ${tip::12}; \"main\" stays where it is." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:main" "${IMAGE}@${DIGEST}"
      # Signed SLSA provenance stored next to the image in GHCR. Verify before deploying with
      # `gh attestation verify oci://<image>@<digest> --owner <owner>` (docs/deploy-k3s.md).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
