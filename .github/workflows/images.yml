name: Images

# The Raspberry Pi nodes (Pi 5 / Pi 4) run arm64 and the N95 server amd64. Building under QEMU is
# slow, so pull requests only build arm64 when they change what goes into the images. Pushes to
# main and version tags publish both architectures to GHCR as one multi-arch image each
# (docs/deploy-k3s.md): ghcr.io/<owner>/relayfiles-app and ghcr.io/<owner>/relayfiles-tools.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - package.json
      - package-lock.json
      - .github/workflows/images.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }} (linux/arm64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [app, tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        run: |
          docker buildx build --platform linux/arm64 --target "${{ matrix.target }}" \
            --cache-from "type=gha,scope=arm64-${{ matrix.target }}" \
            --cache-to "type=gha,mode=max,scope=arm64-${{ matrix.target }}" \
            --tag "relayfiles-${{ matrix.target }}:arm64-ci" .

  publish:
    name: Publish ${{ matrix.target }} (linux/amd64 + linux/arm64)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [app, tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # sha-<12 hex> for every push (what deploy/scripts/k3s/deploy.sh pins), plus "main" or the
      # version and "latest" for a v* tag. GHCR names must be lowercase.
      - name: Build and push
        env:
          TARGET: ${{ matrix.target }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/relayfiles-${TARGET}"
          tags=(--tag "${image}:sha-${GITHUB_SHA::12}")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags+=(--tag "${image}:${GITHUB_REF_NAME}" --tag "${image}:latest")
          else
            tags+=(--tag "${image}:main")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --target "$TARGET" \
            --cache-from "type=gha,scope=arm64-${TARGET}" \
            --cache-from "type=gha,scope=multi-${TARGET}" \
            --cache-to "type=gha,mode=max,scope=multi-${TARGET}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${tags[@]}" --push .
