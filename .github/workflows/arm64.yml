name: arm64 images

# The Raspberry Pi nodes (Pi 5 / Pi 4) run arm64. Building under QEMU is slow, so this runs on
# main and on pull requests that change what goes into the images, not on every change.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - package.json
      - package-lock.json
      - .github/workflows/arm64.yml

permissions:
  contents: read

concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }} (linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [app, tools]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only; pushing multi-arch images to GHCR comes with the k3s deployment.
      - name: Build
        run: |
          docker buildx build --platform linux/arm64 --target "${{ matrix.target }}" \
            --cache-from "type=gha,scope=arm64-${{ matrix.target }}" \
            --cache-to "type=gha,mode=max,scope=arm64-${{ matrix.target }}" \
            --tag "relayfiles-${{ matrix.target }}:arm64-ci" .
