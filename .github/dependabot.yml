# Dependency updates. Security fixes are opened as soon as an advisory appears; routine updates
# come weekly, grouped so one PR carries the minor and patch bumps of an ecosystem, and only for
# releases at least a week old (cooldown): a hijacked release is usually caught and pulled before
# it reaches us. Major versions get their own PRs (reviewed one by one).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (CLAUDE.md).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Base image of the app and tools images (Dockerfile NODE_IMAGE).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7

  # postgres, redis, nginx and cloudflared in the production stack.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
