# RelayFiles production stack (docs/deploy-ubuntu.md). Every value comes from .env:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#
# app      Next.js server (internal only; reached through nginx)
# worker   thumbnails, metadata-stripped copies, cleanup, metrics and health probes
# nginx    the only published port; serves files via X-Accel and the static error pages
# postgres / redis   internal only, data under DATA_DIR on the internal disk
# tools    one-off commands (profile "tools"): migrations, volume:init, admin:create
# cloudflared        optional Cloudflare Tunnel (profile "tunnel")
name: relayfiles

x-app-env: &app-env
  env_file: ${ENV_FILE:-../.env}
  environment:
    NODE_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    DATABASE_URL: ""
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_URL: ""
    STORAGE_ACCEL_ENABLED: "true"
    HEALTH_PROBE_URL: http://app:${APP_PORT:-3000}
    PORT: ${APP_PORT:-3000}
    HOSTNAME: 0.0.0.0

x-image-build: &image-build
  context: ..
  args:
    STORAGE_UID: ${STORAGE_UID:-10001}
    STORAGE_GID: ${STORAGE_GID:-10001}

x-storage: &storage
  - ${STORAGE_ROOT:?set STORAGE_ROOT in .env}:${STORAGE_ROOT}
  - ${LOG_DIR:-/var/log/relayfiles}:${LOG_DIR:-/var/log/relayfiles}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relayfiles}
      POSTGRES_USER: ${POSTGRES_USER:-relayfiles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${DATA_DIR:-/srv/relayfiles}/pg:/var/lib/postgresql/data
    networks: [relay]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relayfiles} -d ${POSTGRES_DB:-relayfiles}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes", "--appendfsync", "everysec"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ${DATA_DIR:-/srv/relayfiles}/redis:/data
    networks: [relay]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      retries: 20

  app:
    <<: *app-env
    build:
      <<: *image-build
      target: app
    image: relayfiles-app:${RELEASE_TAG:-latest}
    restart: unless-stopped
    user: "${STORAGE_UID:-10001}:${STORAGE_GID:-10001}"
    volumes: *storage
    networks: [relay]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *app-env
    build:
      <<: *image-build
      target: tools
    image: relayfiles-tools:${RELEASE_TAG:-latest}
    restart: unless-stopped
    user: "${STORAGE_UID:-10001}:${STORAGE_GID:-10001}"
    command: ["npm", "run", "worker"]
    volumes: *storage
    networks: [relay]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  tools:
    <<: *app-env
    image: relayfiles-tools:${RELEASE_TAG:-latest}
    profiles: [tools]
    user: "${STORAGE_UID:-10001}:${STORAGE_GID:-10001}"
    volumes: *storage
    networks: [relay]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    # Same account as the files on the SSD (0600), group 0 for the image's writable dirs.
    user: "${STORAGE_UID:-10001}:0"
    environment:
      APP_UPSTREAM: app:${APP_PORT:-3000}
      SERVER_NAME: ${SERVER_NAME:-localhost}
      STORAGE_ROOT: ${STORAGE_ROOT}
      STORAGE_ACCEL_PREFIX: ${STORAGE_ACCEL_PREFIX:-/_protected/}
      CLOUDFLARED_IP: ${CLOUDFLARED_IP:-172.28.0.250}
    ports:
      - "${NGINX_LISTEN_PORT:-80}:8080"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./error-pages:/usr/share/nginx/error:ro
      - ./maintenance:/etc/nginx/maintenance:ro
      - ${STORAGE_ROOT}:${STORAGE_ROOT}:ro
    networks: [relay]
    depends_on: [app]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      relay:
        ipv4_address: ${CLOUDFLARED_IP:-172.28.0.250}
    depends_on: [nginx]

networks:
  relay:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/24}
