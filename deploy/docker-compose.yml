# RelayFiles production stack (docs/deploy-ubuntu.md). Every value comes from .env:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#
# app      Next.js server (internal only; reached through nginx)
# worker   thumbnails, metadata-stripped copies, cleanup, metrics and health probes
# nginx    the only published port; serves files via X-Accel and the static error pages
# postgres / redis   internal only, data under DATA_DIR
# tools    one-off commands (profile "tools"): migrations, volume:init, admin:create
# Host directories (STORAGE_ROOT, LOG_DIR, DATA_DIR/pg, DATA_DIR/redis) are never created by
# Docker: when the disk that holds them is not mounted, the containers refuse to start instead
# of writing to the empty mount point (deploy/scripts/setup-docker.sh creates them once).
# Extra SSDs are mounted by deploy/docker-compose.volumes.yml (see docker-compose.volumes.example.yml).
# cloudflared        optional Cloudflare Tunnel (profile "tunnel")
# Every service rotates its container log (DOCKER_LOG_MAX_SIZE x DOCKER_LOG_MAX_FILE). The app
# and tools images start under tini (Dockerfile ENTRYPOINT), which reaps orphaned processes, so
# `init: true` is not set here: one init, the same in Compose, k3s and plain docker run.
name: relayfiles

x-logging: &logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

# The worker's own command: one Node process (no npm or tsx launcher in between).
x-worker-command: &worker-command ["node", "--import", "tsx", "--conditions=react-server", "scripts/worker.mts"]

x-app-env: &app-env
  env_file: ${ENV_FILE:-../.env}
  environment:
    NODE_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    DATABASE_URL: ""
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_URL: ""
    STORAGE_ACCEL_ENABLED: "true"
    HEALTH_PROBE_URL: http://app:${APP_PORT:-3000}
    PORT: ${APP_PORT:-3000}
    HOSTNAME: 0.0.0.0
    # The optional dav service listens on the compose network (Nginx forwards /dav/ to it).
    DAV_HOST: 0.0.0.0
    # The offsite backup runs on the host (deploy/scripts/offsite-backup.sh): its keys stay out of the containers.
    RESTIC_REPOSITORY: ""
    RESTIC_PASSWORD: ""
    OFFSITE_ACCESS_KEY_ID: ""
    OFFSITE_SECRET_ACCESS_KEY: ""
    # The tunnel's own container gets the token; with it, anyone could serve this site's traffic.
    CLOUDFLARE_TUNNEL_TOKEN: ""

x-image-build: &image-build
  context: ..
  args:
    STORAGE_UID: ${STORAGE_UID:-10001}
    STORAGE_GID: ${STORAGE_GID:-10001}

x-storage-mount: &storage-mount
  type: bind
  source: ${STORAGE_ROOT:?set STORAGE_ROOT in .env}
  target: ${STORAGE_ROOT}
  bind: { create_host_path: false }

x-log-mount: &log-mount
  type: bind
  source: ${LOG_DIR:-/var/log/relayfiles}
  target: ${LOG_DIR:-/var/log/relayfiles}
  bind: { create_host_path: false }

x-storage: &storage
  - *storage-mount
  - *log-mount

# App and worker run with no Linux capabilities, a read-only root filesystem (scratch space in
# /tmp only) and bounded processes, memory and CPU: a runaway ffmpeg conversion or thumbnail
# job is stopped by its own container's limit instead of pushing PostgreSQL into the OOM killer.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  pids_limit: 512

# PostgreSQL and Redis start as root only to hand their data to their own account and switch to
# it: these are the capabilities their entrypoints need for that, nothing else.
x-data-hardening: &data-hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  pids_limit: 256

services:
  postgres:
    <<: *data-hardening
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relayfiles}
      POSTGRES_USER: ${POSTGRES_USER:-relayfiles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - type: bind
        source: ${DATA_DIR:-/srv/relayfiles}/pg
        target: /var/lib/postgresql/data
        bind: { create_host_path: false }
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relayfiles} -d ${POSTGRES_DB:-relayfiles}"]
      interval: 5s
      retries: 20

  redis:
    <<: *data-hardening
    image: redis:7@sha256:bd28fff4b665fdf1b73e8b5b73ec05d2f858f4fa3c8ea0d7c9bc09f7f6bf7039
    restart: unless-stopped
    logging: *logging
    # noeviction: when REDIS_MAXMEMORY_MB is reached, writes fail instead of silently dropping jobs and limits.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "${REDIS_MAXMEMORY_MB:-256}mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - type: bind
        source: ${DATA_DIR:-/srv/relayfiles}/redis
        target: /data
        bind: { create_host_path: false }
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      retries: 20

  app:
    <<: [*app-env, *hardening]
    build:
      <<: *image-build
      target: app
    image: relayfiles-app:${RELEASE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # Next.js keeps its fetch/route cache here; it is rebuilt on start.
    tmpfs: [/tmp, /app/.next/cache]
    mem_limit: ${APP_MEMORY_MAX:-2G}
    cpus: ${APP_CPUS:-3}
    # On stop (release, restart) tini passes SIGTERM to Node, which stops accepting connections and
    # finishes the requests in flight (streams, zips, upload chunks) for this long before the kill.
    stop_grace_period: ${APP_STOP_GRACE_SEC:-30}s
    user: "${STORAGE_UID:-10001}:${STORAGE_GID:-10001}"
    volumes: *storage
    # relay: Nginx reaches it; data: PostgreSQL and Redis.
    networks: [relay, data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: [*app-env, *hardening]
    build:
      <<: *image-build
      target: tools
    image: relayfiles-tools:${RELEASE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WORKER_MEMORY_MAX:-2G}
    cpus: ${WORKER_CPUS:-2}
    # Running jobs (thumbnails, cleanup) finish before the worker exits (systemd: TimeoutStopSec).
    stop_grace_period: ${WORKER_STOP_GRACE_SEC:-90}s
    user: "${STORAGE_UID:-10001}:${STORAGE_GID:-10001}"
    command: *worker-command
    volumes: *storage
    # relay: the health probe calls the app and notifications leave for the webhook; data: PostgreSQL and Redis.
    networks: [relay, data, scan]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  tools:
    # The same limits as the worker: migrations, imports and admin scripts touch the database and
    # every file on the SSD. npm and tsx keep their caches in the /tmp tmpfs.
    <<: [*app-env, *hardening]
    image: relayfiles-tools:${RELEASE_TAG:-latest}
    profiles: [tools]
    logging: *logging
    user: "${STORAGE_UID:-10001}:${STORAGE_GID:-10001}"
    volumes:
      - *storage-mount
      - *log-mount
      # volume:init writes the Nginx location of an extra SSD here (or prints it when not allowed).
      - ./nginx/volumes:/app/deploy/nginx/volumes
    # Only the databases: admin scripts and migrations reach nothing else.
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  dav:
    # WebDAV (optional): docker compose --profile dav up -d dav. Read-only network drive for
    # personal API tokens (files:read); Nginx forwards /dav/ to it (docs/deploy-ubuntu.md).
    <<: [*app-env, *hardening]
    image: relayfiles-tools:${RELEASE_TAG:-latest}
    profiles: [dav]
    restart: unless-stopped
    logging: *logging
    mem_limit: ${DAV_MEMORY_MAX:-512M}
    stop_grace_period: ${APP_STOP_GRACE_SEC:-30}s
    user: "${STORAGE_UID:-10001}:${STORAGE_GID:-10001}"
    command: ["node", "--import", "tsx", "--conditions=react-server", "scripts/dav-server.mts"]
    volumes: *storage
    # relay: Nginx reaches it; data: PostgreSQL and Redis.
    networks: [relay, data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    # 1.30 is the maintained stable branch (1.29 mainline no longer gets updates).
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    restart: unless-stopped
    logging: *logging
    # Read-only: the image renders the templates into /etc/nginx/conf.d (a tmpfs here) when it
    # starts, and keeps its pid file and request buffers in /tmp and /var/cache/nginx.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/etc/nginx/conf.d, /tmp, /var/cache/nginx]
    pids_limit: 512
    # Same account as the files on the SSD (0600), group 0 for the image's writable dirs.
    user: "${STORAGE_UID:-10001}:0"
    # The image stops Nginx with SIGQUIT (graceful): downloads it is sending finish like the app's.
    stop_grace_period: ${APP_STOP_GRACE_SEC:-30}s
    environment:
      APP_UPSTREAM: app:${APP_PORT:-3000}
      DAV_UPSTREAM: dav:${DAV_PORT:-3002}
      NGINX_RESOLVER: 127.0.0.11
      SERVER_NAME: ${SERVER_NAME:-localhost}
      STORAGE_ROOT: ${STORAGE_ROOT}
      STORAGE_ACCEL_PREFIX: ${STORAGE_ACCEL_PREFIX:-/_protected/}
      CLOUDFLARED_IP: ${CLOUDFLARED_IP:-172.28.0.250}
      # Unset: the broadcast address, which is never a TCP peer, so no host proxy is trusted.
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-255.255.255.255}
      NGINX_MAX_BODY_MB: ${NGINX_MAX_BODY_MB:-100}
      NGINX_AUTH_RATE_PER_MIN: ${NGINX_AUTH_RATE_PER_MIN:-20}
      NGINX_AUTH_BURST: ${NGINX_AUTH_BURST:-20}
      NGINX_UPLOAD_RATE_PER_MIN: ${NGINX_UPLOAD_RATE_PER_MIN:-60}
      NGINX_UPLOAD_BURST: ${NGINX_UPLOAD_BURST:-30}
      NGINX_TUS_RATE_PER_MIN: ${NGINX_TUS_RATE_PER_MIN:-600}
      NGINX_TUS_BURST: ${NGINX_TUS_BURST:-120}
      NGINX_API_RATE_PER_MIN: ${NGINX_API_RATE_PER_MIN:-120}
      NGINX_API_BURST: ${NGINX_API_BURST:-60}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
    ports:
      - "${NGINX_LISTEN_HOST:-0.0.0.0}:${NGINX_LISTEN_PORT:-80}:8080"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./error-pages:/usr/share/nginx/error:ro
      - ./maintenance:/etc/nginx/maintenance:ro
      - ./nginx/volumes:/etc/nginx/volumes:ro
      - <<: *storage-mount
        read_only: true
    networks: [relay]
    depends_on: [app]

  # Virus scans of files received through upload-only links (docs/security.md "업로드 링크 검사").
  # Off unless started: docker compose --profile clamav up -d, then CLAMAV_HOST=clamav in .env.
  # About 1.5 GB of memory for the signatures (x86-64 only; on ARM use the host's clamav-daemon).
  clamav:
    # Pinned like the other images; bump it with them.
    image: clamav/clamav:1.4@sha256:cbc30de94b6e9b33ac14136ff45306cee02a1f9ae522394a3cc5b9215d1affe9
    profiles: [clamav]
    restart: unless-stopped
    logging: *logging
    # The entrypoint hands /var/lib/clamav to the clamav user and switches to it.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 256
    mem_limit: ${CLAMAV_MEMORY_MAX:-2G}
    environment:
      # As large as SCAN.maxBytes (2 GB): larger files are not sent and stay unshared.
      CLAMD_CONF_StreamMaxLength: 2000M
      CLAMD_CONF_MaxFileSize: 2000M
      CLAMD_CONF_MaxScanSize: 2000M
    volumes:
      - type: bind
        source: ${DATA_DIR:-/srv/relayfiles}/clamav
        target: /var/lib/clamav
        bind: { create_host_path: false }
    # freshclam downloads signature updates, so this network reaches the internet; only the worker joins it.
    networks: [scan]
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      start_period: 300s
      retries: 5

  cloudflared:
    # Pinned: `latest` would change the tunnel client on any pull. Bump it with the other images.
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    profiles: [tunnel]
    restart: unless-stopped
    logging: *logging
    # The image runs as a non-root user and only connects out: no capabilities or writes needed.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    pids_limit: 128
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      relay:
        ipv4_address: ${CLOUDFLARED_IP:-172.28.0.250}
    depends_on: [nginx]

networks:
  # Nginx, cloudflared, the app and the worker. Has the subnet cloudflared's fixed address and
  # TRUSTED_PROXY_IP (its gateway) are in.
  relay:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/24}
  # PostgreSQL and Redis with the app, worker and tools only. internal: no route out to the
  # internet, and Nginx or cloudflared (the parts facing visitors) cannot reach the databases.
  data:
    internal: true
  # The worker and clamd (profile clamav): clamd's signature updates need the internet.
  scan: {}
