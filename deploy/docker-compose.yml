# RelayFiles production stack (docs/deploy-ubuntu.md). Every value comes from .env:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#
# app      Next.js server (internal only; reached through nginx)
# worker   thumbnails, metadata-stripped copies, cleanup, metrics and health probes
# nginx    the only published port; serves files via X-Accel and the static error pages
# postgres / redis   internal only, data under DATA_DIR
# tools    one-off commands (profile "tools"): migrations, volume:init, admin:create
# Host directories (STORAGE_ROOT, LOG_DIR, DATA_DIR/pg, DATA_DIR/redis) are never created by
# Docker: when the disk that holds them is not mounted, the containers refuse to start instead
# of writing to the empty mount point (deploy/scripts/setup-docker.sh creates them once).
# Extra SSDs are mounted by deploy/docker-compose.volumes.yml (see docker-compose.volumes.example.yml).
# cloudflared        optional Cloudflare Tunnel (profile "tunnel")
# Every service rotates its container log (DOCKER_LOG_MAX_SIZE x DOCKER_LOG_MAX_FILE). The app
# and tools images start under tini (Dockerfile ENTRYPOINT), which reaps orphaned processes, so
# `init: true` is not set here: one init, the same in Compose, k3s and plain docker run.
name: relayfiles

x-logging: &logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

# The worker's own command: one Node process (no npm or tsx launcher in between).
x-worker-command: &worker-command ["node", "--import", "tsx", "--conditions=react-server", "scripts/worker.mts"]

x-app-env: &app-env
  env_file: ${ENV_FILE:-../.env}
  environment:
    NODE_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    DATABASE_URL: ""
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_URL: ""
    STORAGE_ACCEL_ENABLED: "true"
    HEALTH_PROBE_URL: http://app:${APP_PORT:-3000}
    PORT: ${APP_PORT:-3000}
    HOSTNAME: 0.0.0.0

x-image-build: &image-build
  context: ..
  args:
    STORAGE_UID: ${STORAGE_UID:-10001}
    STORAGE_GID: ${STORAGE_GID:-10001}

x-storage-mount: &storage-mount
  type: bind
  source: ${STORAGE_ROOT:?set STORAGE_ROOT in .env}
  target: ${STORAGE_ROOT}
  bind: { create_host_path: false }

x-log-mount: &log-mount
  type: bind
  source: ${LOG_DIR:-/var/log/relayfiles}
  target: ${LOG_DIR:-/var/log/relayfiles}
  bind: { create_host_path: false }

x-storage: &storage
  - *storage-mount
  - *log-mount

# App and worker run with no Linux capabilities, a read-only root filesystem (scratch space in
# /tmp only) and bounded processes, memory and CPU: a runaway ffmpeg conversion or thumbnail
# job is stopped by its own container's limit instead of pushing PostgreSQL into the OOM killer.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  pids_limit: 512

services:
  postgres:
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relayfiles}
      POSTGRES_USER: ${POSTGRES_USER:-relayfiles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - type: bind
        source: ${DATA_DIR:-/srv/relayfiles}/pg
        target: /var/lib/postgresql/data
        bind: { create_host_path: false }
    networks: [relay]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relayfiles} -d ${POSTGRES_DB:-relayfiles}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7@sha256:bd28fff4b665fdf1b73e8b5b73ec05d2f858f4fa3c8ea0d7c9bc09f7f6bf7039
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes", "--appendfsync", "everysec"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - type: bind
        source: ${DATA_DIR:-/srv/relayfiles}/redis
        target: /data
        bind: { create_host_path: false }
    networks: [relay]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      retries: 20

  app:
    <<: [*app-env, *hardening]
    build:
      <<: *image-build
      target: app
    image: relayfiles-app:${RELEASE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # Next.js keeps its fetch/route cache here; it is rebuilt on start.
    tmpfs: [/tmp, /app/.next/cache]
    mem_limit: ${APP_MEMORY_MAX:-2G}
    cpus: ${APP_CPUS:-3}
    user: "${STORAGE_UID:-10001}:${STORAGE_GID:-10001}"
    volumes: *storage
    networks: [relay]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: [*app-env, *hardening]
    build:
      <<: *image-build
      target: tools
    image: relayfiles-tools:${RELEASE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WORKER_MEMORY_MAX:-2G}
    cpus: ${WORKER_CPUS:-2}
    # Running jobs (thumbnails, cleanup) finish before the worker exits (systemd: TimeoutStopSec=60).
    stop_grace_period: 60s
    user: "${STORAGE_UID:-10001}:${STORAGE_GID:-10001}"
    command: *worker-command
    volumes: *storage
    networks: [relay]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  tools:
    # The same limits as the worker: migrations, imports and admin scripts touch the database and
    # every file on the SSD. npm and tsx keep their caches in the /tmp tmpfs.
    <<: [*app-env, *hardening]
    image: relayfiles-tools:${RELEASE_TAG:-latest}
    profiles: [tools]
    logging: *logging
    user: "${STORAGE_UID:-10001}:${STORAGE_GID:-10001}"
    volumes:
      - *storage-mount
      - *log-mount
      # volume:init writes the Nginx location of an extra SSD here (or prints it when not allowed).
      - ./nginx/volumes:/app/deploy/nginx/volumes
    networks: [relay]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    # 1.30 is the maintained stable branch (1.29 mainline no longer gets updates).
    image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    restart: unless-stopped
    logging: *logging
    # Not read-only: the image renders the templates into /etc/nginx/conf.d when it starts.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    # Same account as the files on the SSD (0600), group 0 for the image's writable dirs.
    user: "${STORAGE_UID:-10001}:0"
    environment:
      APP_UPSTREAM: app:${APP_PORT:-3000}
      SERVER_NAME: ${SERVER_NAME:-localhost}
      STORAGE_ROOT: ${STORAGE_ROOT}
      STORAGE_ACCEL_PREFIX: ${STORAGE_ACCEL_PREFIX:-/_protected/}
      CLOUDFLARED_IP: ${CLOUDFLARED_IP:-172.28.0.250}
      # Unset: the broadcast address, which is never a TCP peer, so no host proxy is trusted.
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-255.255.255.255}
    ports:
      - "${NGINX_LISTEN_HOST:-0.0.0.0}:${NGINX_LISTEN_PORT:-80}:8080"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./error-pages:/usr/share/nginx/error:ro
      - ./maintenance:/etc/nginx/maintenance:ro
      - ./nginx/volumes:/etc/nginx/volumes:ro
      - <<: *storage-mount
        read_only: true
    networks: [relay]
    depends_on: [app]

  cloudflared:
    # Pinned: `latest` would change the tunnel client on any pull. Bump it with the other images.
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    profiles: [tunnel]
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      relay:
        ipv4_address: ${CLOUDFLARED_IP:-172.28.0.250}
    depends_on: [nginx]

networks:
  relay:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/24}
