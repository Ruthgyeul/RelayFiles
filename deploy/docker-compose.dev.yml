# Development services (PostgreSQL 16 + Redis 7). All values come from .env:
#   docker compose --env-file .env -f deploy/docker-compose.dev.yml up -d
# The app itself runs on the host with `npm run dev`. The production compose file
# (app, worker, database, redis) is added in M15.
name: relayfiles-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relayfiles}
      POSTGRES_USER: ${POSTGRES_USER:-relayfiles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PUBLISH:-127.0.0.1:5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relayfiles}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PUBLISH:-127.0.0.1:6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  postgres-data:
  redis-data:
